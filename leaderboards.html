<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Emberwolf, a dark fantasy RPG played in NoDiceGG on Discord.">
  <title>Leaderboards · Emberwolf</title>
  <link rel="stylesheet" href="./style.css?v=emberforms">
  <script src="./rankings.js?v=ashgate" defer></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./">Emberwolf</a>
  <nav aria-label="Main"><a href="./">Home</a><a href="./leaderboards.html" aria-current="page">Leaderboards</a></nav>
</header>
<main>
  <section class="board-masthead"><div class="shell">
    <p class="kicker">The Ashgate records</p>
    <h1>Leaderboards</h1>
    <p class="lede">The ten highest-XP heroes in NoDiceGG.</p>
  </div></section>
  <section class="shell board" aria-labelledby="rank-title">
    <div class="board-heading"><h2 id="rank-title">Hero rankings</h2><a class="text-link" href="https://discord.com/channels/1289753596233126010">Play in Discord</a></div>
    <p id="status" class="status" role="status">Loading live rankings…</p>
    <div class="table-frame" hidden><table aria-labelledby="rank-title">
      <thead><tr><th scope="col">Rank</th><th scope="col">Hero</th><th scope="col">Class</th><th scope="col">Level</th><th scope="col">XP</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <noscript>Enable JavaScript to load the live rankings.</noscript>
  </section>
</main>
<footer class="site-footer"><a class="brand" href="./">Emberwolf</a><span>A Discord RPG in NoDiceGG</span></footer>
</body>
</html>
